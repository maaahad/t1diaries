[workspace]
resolver = "2"
members = [
  "apps/api",
  "crates/app-config",
  "crates/error",
  "crates/db",
  "crates/cache",
  "crates/auth",
  "crates/users",
  "crates/blogs",
  "crates/stats",
  "crates/devices",
  "crates/email",
  "crates/graphql",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = [
  "cors",
  "trace",
  "compression-full",
] }
tower-cookies = { version = "0.11" }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = { version = "7" }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
deadpool-redis = { version = "0.16" }
redis = { version = "0.27" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = { version = "2" }
anyhow = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5" }
rand_core = { version = "0.6", features = ["std"] }
jsonwebtoken = { version = "9" }
validator = { version = "0.18", features = ["derive"] }
dotenvy = { version = "0.15" }
config = { version = "0.14" }
lettre = { version = "0.11", default-features = false, features = [
  "tokio1",
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
] }

[workspace.package]
edition = "2021"
version = "0.1.0"
